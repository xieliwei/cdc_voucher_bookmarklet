name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Generate loader bookmarklet and release notes
        run: node scripts/generate-loader-bookmarklet.mjs --tag "${{ github.ref_name }}" --repo "${{ github.repository }}"

      - name: Read integrity hash
        id: hash
        run: echo "integrity=$(tr -d '\n' < dist/cdc-voucher-collector.js.sha384)" >> "$GITHUB_OUTPUT"

      - name: Update install docs
        run: node scripts/update-install-docs.mjs "${{ github.ref_name }}" "${{ steps.hash.outputs.integrity }}"

      - name: Commit install docs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/versions.json /tmp/versions.json
          cp docs/install.html /tmp/install.html
          cp -r docs/releases /tmp/releases
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          cp /tmp/versions.json docs/versions.json
          cp /tmp/install.html docs/install.html
          cp -r /tmp/releases/* docs/releases/
          git add docs/versions.json docs/install.html docs/releases/
          git diff --staged --quiet || git commit -m "docs: add install page entry for ${{ github.ref_name }}"
          git push origin main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.2
        with:
          body_path: dist/release-notes-${{ github.ref_name }}.md
          files: |
            dist/cdc-voucher-collector.js
            dist/cdc-voucher-collector.js.sha384
            dist/loader-bookmarklet-${{ github.ref_name }}.txt
            dist/install-${{ github.ref_name }}.html
